name: Docker CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: self-hosted

    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Before 상태 기록
        run: echo "BEFORE_REV=$(curl -fsS http://127.0.0.1:8000/version.txt || echo none)" >> $GITHUB_ENV

      - name: Pull latest image
        run: docker pull "${{ secrets.DOCKERHUB_USERNAME }}/spam-detector-lab:latest"

      - name: Replace container
        run: |
          docker rm -f spam-detector || true
          docker run -d \
            --name spam-detector \
            --restart unless-stopped \
            -p 127.0.0.1:8000:80 \
            "${{ secrets.DOCKERHUB_USERNAME }}/spam-detector-lab:latest"

      - name: 배포 검증 리포트
        run: |
          sleep 3
          ok=0; fail=0
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/ || echo 000)
            if [ "$code" = "200" ]; then ok=$((ok+1)); else fail=$((fail+1)); fi
            sleep 1
          done
          AFTER_REV=$(curl -fsS http://127.0.0.1:8000/version.txt || echo none)
          if [ "$fail" -eq 0 ]; then RESULT=SUCCESS; else RESULT=FAILURE; fi
          {
            echo "## Spam Detector deployment verification"
            echo ""
            echo "**Result: $RESULT** | Stable URL: http://127.0.0.1:8000/"
            echo ""
            echo "API requests: $((ok+fail)) total; $ok successful; $fail failed"
            echo ""
            echo "| Stage | Revision | HTTP check |"
            echo "|---|---|---|"
            echo "| Before | $BEFORE_REV | - |"
            echo "| After | $AFTER_REV | $ok/$((ok+fail)) OK |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$fail" -ne 0 ]; then
            docker logs spam-detector
            exit 1
          fi
