<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>스팸 문자 판독기</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <h1>스팸 문자 판독기</h1>
    <p class="subtitle">문자 내용을 붙여넣으면 AI가 스팸인지 판독합니다.</p>

    <textarea id="input" rows="4" placeholder="예) [광고] 무료 쿠폰 당첨! 지금 링크를 클릭하세요"></textarea>

    <div class="actions">
      <button id="check" type="button">판독하기</button>
      <button id="clear" type="button" class="ghost">지우기</button>
    </div>

    <div class="samples">
      <span>예시:</span>
      <button type="button" class="chip" data-text="축하합니다 무료 상품권 당첨 지금 링크 클릭하세요">스팸 예시</button>
      <button type="button" class="chip" data-text="내일 수업 끝나고 같이 밥 먹자">정상 예시</button>
    </div>

    <section id="result" class="result hidden" aria-live="polite">
      <div id="verdict" class="verdict"></div>
      <div class="bar"><div id="bar-fill" class="bar-fill"></div></div>
      <p id="prob" class="prob"></p>
      <div id="reasons" class="reasons"></div>
    </section>

    <footer id="model-info" class="model-info">모델 불러오는 중...</footer>
  </main>

  <script src="classifier.js"></script>
  <script src="app.js"></script>
</body>
</html>
