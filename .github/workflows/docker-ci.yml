name: CI
on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 모델 재학습
        run: node train.js

      - name: 정확도 테스트 (기준 미달이면 여기서 중단)
        run: node --test

      - name: 모델 버전 읽기
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_ENV

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/spam-detector-lab:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/spam-detector-lab:${{ env.VERSION }}
